<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Touchless Drawing Board</title>

<style>
body{
    margin:0;
    background:#111;
    overflow:hidden;
    text-align:center;
}

video{
    position:absolute;
    transform: scaleX(-1);
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

canvas{
    position:absolute;
    top:0;
    left:0;
    z-index:2;
}


#toolbar{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:10;
}

.color{
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid white;
}

button{
    padding:8px 12px;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="toolbar">
    <div class="color" style="background:pink" onclick="setColor('pink')"></div>
    <div class="color" style="background:blue" onclick="setColor('blue')"></div>
    <div class="color" style="background:lime" onclick="setColor('lime')"></div>
    <div class="color" style="background:black" onclick="setColor('black')"></div>
    <button onclick="clearCanvas()">Clear</button>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let currentColor = "pink";
let prevX = null;
let prevY = null;

function setColor(color){
    currentColor = color;
}

function clearCanvas(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
}

navigator.mediaDevices.getUserMedia({
    video:true
})
.then(stream=>{
    video.srcObject = stream;
});

const hands = new Hands({
    locateFile: (file)=>{
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
});

hands.setOptions({
    maxNumHands:1,
    modelComplexity:1,
    minDetectionConfidence:0.7,
    minTrackingConfidence:0.7
});

hands.onResults(results=>{

    if(results.multiHandLandmarks &&
       results.multiHandLandmarks.length>0){

        const landmarks =
        results.multiHandLandmarks[0];

        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];

        let smoothFactor = 0.7;

        // Non-mirrored drawing
        const rawX = (1 - indexTip.x) * canvas.width;
        const rawY = indexTip.y * canvas.height;

        let x = prevX === null
            ? rawX
            : prevX * smoothFactor +
            rawX * (1 - smoothFactor);

        let y = prevY === null
            ? rawY
            : prevY * smoothFactor +
            rawY * (1 - smoothFactor);

        const dx =
        indexTip.x - thumbTip.x;

        const dy =
        indexTip.y - thumbTip.y;

        const distance =
        Math.sqrt(dx*dx + dy*dy);

        if(distance < 0.05){
            if(prevX !== null){

    ctx.beginPath();
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = 10;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.moveTo(prevX, prevY);
    ctx.lineTo(x, y);
    ctx.stroke();
}
else{
    prevX = null;
    prevY = null;
}

prevX = x;
prevY = y;

            if(prevX !== null){

                ctx.beginPath();
                ctx.strokeStyle =
                currentColor;

                ctx.lineWidth = 10;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";

                ctx.moveTo(prevX, prevY);
                ctx.lineTo(x, y);
                ctx.stroke();
            }

            prevX = x;
            prevY = y;

        } else {

            prevX = null;
            prevY = null;
        }
        if (prevX !== null && prevY !== null) {
    ctx.beginPath();
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.moveTo(prevX, prevY);
    ctx.lineTo(x, y);
    ctx.stroke();
}

prevX = x;
prevY = y;


}
});

const camera = new Camera(video,{
    onFrame: async ()=>{
        await hands.send({
            image: video
        });
    },
    width:1280,
    height:720
});

camera.start();
</script>

</body>
</html>
